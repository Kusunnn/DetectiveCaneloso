<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1031" viewBox="0 0 1200 1031">
  <!-- Foto del grupo de hace 20 años (HU-07): misma composición que foto_grupo.png, con más detalle para la vista de examen.
       El monitor de la izquierda lleva el silbato al cuello (las iniciales van como Label3D en la escena). -->
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9a582"/>
      <stop offset="0.6" stop-color="#9c8763"/>
    </linearGradient>
    <linearGradient id="suelo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d6a4c"/>
      <stop offset="1" stop-color="#5e4e37"/>
    </linearGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#2a1d0e" stop-opacity="0.55"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="1031" fill="url(#cielo)"/>
  <!-- Pinos del fondo -->
  <g fill="#5b4b35">
    <polygon points="0,560 70,170 140,560"/>
    <polygon points="110,560 200,220 290,560"/>
    <polygon points="250,560 360,120 470,560"/>
    <polygon points="420,560 510,250 600,560"/>
    <polygon points="560,560 640,90 720,560"/>
    <polygon points="980,560 1060,140 1140,560"/>
    <polygon points="1090,560 1160,260 1230,560"/>
  </g>
  <!-- Cabaña -->
  <polygon points="700,330 905,190 1110,330" fill="#4f402c"/>
  <rect x="725" y="330" width="360" height="230" fill="#5d4c33"/>
  <rect x="840" y="410" width="66" height="150" fill="#3a2e1f"/>
  <rect x="955" y="390" width="80" height="62" fill="#8f7b58"/>
  <line x1="995" y1="390" x2="995" y2="452" stroke="#4f402c" stroke-width="6"/>
  <!-- Letrero de la cabaña 4 -->
  <rect x="760" y="352" width="56" height="40" fill="#d2c19e"/>
  <path d="M792 358 L800 358 L800 386 L792 386 L792 379 L770 379 L770 373 L789 358 Z M792 366 L778 373 L792 373 Z" fill="#3a2e1f" fill-rule="evenodd"/>
  <!-- Suelo -->
  <rect x="0" y="560" width="1200" height="471" fill="url(#suelo)"/>
  <!-- Monitor (izquierda): gorra, cuello y el silbato -->
  <g fill="#2f261b">
    <path d="M182 316 Q184 276 222 274 Q258 276 260 312 Z"/>
    <path d="M214 306 L292 312 L290 322 L212 320 Z"/>
    <circle cx="220" cy="350" r="42"/>
    <rect x="166" y="392" width="108" height="270" rx="18"/>
    <rect x="178" y="660" width="36" height="200"/>
    <rect x="226" y="660" width="36" height="200"/>
    <rect x="146" y="410" width="26" height="190" rx="12" transform="rotate(8 159 410)"/>
    <rect x="270" y="410" width="26" height="190" rx="12" transform="rotate(-8 283 410)"/>
  </g>
  <!-- Cordón trenzado y silbato -->
  <path d="M196 396 Q206 470 216 520 Q226 470 244 396" fill="none" stroke="#e7dcc4" stroke-width="5"/>
  <path d="M199 400 Q208 468 216 516" fill="none" stroke="#b8a982" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="200" y="516" width="40" height="22" rx="8" fill="#d9d2c4"/>
  <circle cx="234" cy="527" r="9" fill="#efe9dc"/>
  <rect x="190" y="522" width="14" height="10" rx="3" fill="#c7bfae"/>
  <!-- Campistas de la cabaña 4 -->
  <g fill="#3a2f22">
    <circle cx="420" cy="470" r="32"/><rect x="386" y="500" width="68" height="200" rx="14"/><rect x="394" y="696" width="22" height="130"/><rect x="424" y="696" width="22" height="130"/>
    <circle cx="560" cy="460" r="33"/><rect x="525" y="492" width="70" height="210" rx="14"/><rect x="533" y="698" width="22" height="130"/><rect x="565" y="698" width="22" height="130"/>
    <circle cx="700" cy="478" r="30"/><rect x="668" y="506" width="64" height="196" rx="14"/><rect x="676" y="698" width="21" height="128"/><rect x="704" y="698" width="21" height="128"/>
    <circle cx="840" cy="462" r="33"/><rect x="805" y="494" width="70" height="208" rx="14"/><rect x="813" y="698" width="22" height="130"/><rect x="845" y="698" width="22" height="130"/>
    <circle cx="980" cy="472" r="31"/><rect x="947" y="502" width="66" height="200" rx="14"/><rect x="955" y="698" width="21" height="128"/><rect x="984" y="698" width="21" height="128"/>
  </g>
  <!-- Daniel, el más pequeño, con su gorra de marinero -->
  <rect x="534" y="418" width="52" height="16" rx="6" fill="#e3d8bf"/>
  <!-- Viñeta, grano y borde blanco de la foto -->
  <rect width="1200" height="1031" fill="url(#vineta)"/>
  <rect x="0" y="0" width="1200" height="1031" fill="none" stroke="#efe6d2" stroke-width="44"/>
  <rect x="22" y="22" width="1156" height="987" fill="none" stroke="#cbbd9c" stroke-width="3"/>
</svg>
